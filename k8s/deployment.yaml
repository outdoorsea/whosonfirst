apiVersion: apps/v1
kind: Deployment
metadata:
  name: wof-api
  labels:
    app: wof-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wof-api
  template:
    metadata:
      labels:
        app: wof-api
    spec:
      containers:
        - name: wof-api
          image: ghcr.io/YOUR_ORG/whosonfirst-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: wof-api-config
            - secretRef:
                name: wof-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
